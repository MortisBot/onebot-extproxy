name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv venv --python "${{ matrix.python }}" .venv
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - run: .venv/bin/python -m pytest -q
      - run: uv build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/scan_secrets.py --tracked-only
