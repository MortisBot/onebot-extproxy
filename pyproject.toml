[project]
name = "onebot-extproxy"
version = "0.1.0"
description = "OneBot v11 / NapCat reverse-WS relay that filters external consumers by feature × group"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["websockets>=17,<18"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/MortisBot/onebot-extproxy"
Source = "https://github.com/MortisBot/onebot-extproxy"

[project.scripts]
onebot-extproxy = "onebot_extproxy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onebot_extproxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: 本机回环集成测试（默认跳过，--run-integration 才跑，不连外网）",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
